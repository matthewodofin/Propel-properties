    <!-- Schema.org RealEstateAgent JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "Propel Properties",
      "description": "Your Trusted Partner in Property & Investment. Providing property sales, rentals, land sales, residential and commercial real estate solutions across Nigeria.",
      "telephone": "+2348082280219",
      "email": "seyiodofin@gmail.com",
      "image": "https://i.imgur.com/pbwyr8M.png",
      "priceRange": "₦₦ - ₦₦₦₦₦",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "33, Anibaba Street, Anibaba",
        "addressLocality": "Ikorodu",
        "addressRegion": "Lagos",
        "addressCountry": "NG"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "08:00",
          "closes": "18:00"
        }
      ],
      "areaServed": [
        "Lagos", "Lekki", "Ajah", "Ikoyi", "Victoria Island", "Ibeju-Lekki", "Epe", "Abuja", "Port Harcourt"
      ]
    }
    </script>
  </head>
  <body class="bg-[#FFFFFF] text-[#1F2937] antialiased selection:bg-[#016DAA] selection:text-white">
    <div id="root">
      <!-- Initial Loading Screen before JS hydrates -->
      <div id="initial-brand-loader" style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:'Plus Jakarta Sans',sans-serif;padding:24px;text-align:center;">
        <div style="position:relative;margin-bottom:24px;">
          <div style="width:104px;height:104px;border-radius:20px;background:#ffffff;border:1px solid #f1f5f9;box-shadow:0 20px 25px -5px rgba(1,109,170,0.1),0 8px 10px -6px rgba(1,109,170,0.1);padding:10px;display:flex;align-items:center;justify-content:center;">
            <img src="/propel-logo.png" onerror="this.src='https://i.imgur.com/pbwyr8M.png'" alt="Propel Properties" style="width:100%;height:100%;object-fit:contain;" />
          </div>
        </div>
        <div style="margin-bottom:8px;">
          <div style="display:flex;align-items:baseline;justify-content:center;gap:8px;font-size:26px;font-weight:900;letter-spacing:-0.02em;">
            <span style="color:#016DAA;">Propel</span>
            <span style="color:#1F2937;letter-spacing:0.22em;font-size:22px;font-weight:800;text-transform:uppercase;">PROPERTIES</span>
            <span style="width:8px;height:8px;border-radius:50%;background:#E5322E;display:inline-block;margin-bottom:3px;"></span>
          </div>
          <p style="font-size:13px;font-weight:600;color:#6b7280;margin:6px 0 0 0;">
            Your Trusted Partner in Property &amp; Investment
          </p>
        </div>
        <div style="margin-top:28px;width:100%;max-width:240px;">
          <div style="height:6px;width:100%;background:#f3f4f6;border-radius:999px;overflow:hidden;position:relative;">
            <div style="height:100%;width:45%;background:linear-gradient(90deg,#016DAA,#0188d4,#E5322E);border-radius:999px;animation:propelProgress 1.4s infinite ease-in-out;"></div>
          </div>
          <p style="font-size:11px;font-weight:600;color:#9ca3af;margin-top:10px;">
            Loading verified properties...
          </p>
        </div>
        <style>
          @keyframes propelProgress {
            0% { transform: translateX(-100%); width: 30%; }
            50% { transform: translateX(50%); width: 65%; }
            100% { transform: translateX(250%); width: 30%; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
